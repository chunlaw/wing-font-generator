name: Publish wing-font to PyPI
# Push a tag like v0.1.0 (matching python/wingfont/__init__.py __version__).
# One-time setup: on pypi.org add a "trusted publisher" for this repo,
# workflow publish-pypi.yml, environment pypi.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tag must match wingfont.__version__
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/wingfont/__init__.py)
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "::error::tag ${GITHUB_REF_NAME} != v$v (python/wingfont/__init__.py)"; exit 1; }
      - run: pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
